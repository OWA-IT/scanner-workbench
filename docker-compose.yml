services:
  ticket-validation:
    image: ${SCANNER_IMAGE:-owadbell/scanner-workbench:latest}
    pull_policy: always
    ports:
      - "${SCANNER_PORT:-8000}:8000"
    env_file:
      - .env
    environment:
      DATABASE_URL: sqlite:////data/scanner.db
    volumes:
      - ${SCANNER_DATA_DIR:-./data}:/data
    restart: unless-stopped
