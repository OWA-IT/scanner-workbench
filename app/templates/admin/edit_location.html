{% extends "base.html" %}

{% block title %}Edit Location{% endblock %}

{% block content %}
<form class="panel panel-form panel-narrow" method="post">
    <div class="panel-heading">
        <h2>Edit Location</h2>
        <a class="ghost-link" href="{{ url_for('admin.locations') }}">Back to locations</a>
    </div>

    <label for="name">Name</label>
    <input id="name" name="name" type="text" value="{{ location.name }}">

    <label for="external_location_id">External Location ID</label>
    <input id="external_location_id" name="external_location_id" type="text" value="{{ location.external_location_id }}">

    <label class="check-row">
        <input name="active" type="checkbox" {% if location.active %}checked{% endif %}>
        <span>Active</span>
    </label>

    <label class="check-row">
        <input name="is_default" type="checkbox" {% if location.is_default %}checked{% endif %}>
        <span>Default location (active locations only)</span>
    </label>

    <button class="primary-button" type="submit">Save Changes</button>
</form>
{% endblock %}
